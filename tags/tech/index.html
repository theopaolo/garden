<!DOCTYPE html>
<html class="view-transition" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="description" content="Un jardin numérique cultivé par Théo.">
    
    <meta name="theme-color" content="#5C4B75">
    <title>tech</title>
    <script>
        try {
            var theme = localStorage.getItem("theme");
            if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        } catch (e) {}
    </script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <link rel="alternate" type="application/atom+xml" href="/feed.xml" title="Jardin numérique">
</head>
<body>
    <svg class="fx-defs" aria-hidden="true" focusable="false" width="0" height="0">
        <defs>
            <filter id="card-grain" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
                <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" stitchTiles="stitch" result="noise" />
                <feColorMatrix in="noise" type="saturate" values="0" result="mono-noise" />
                <feComponentTransfer in="mono-noise" result="grain">
                    <feFuncA type="table" tableValues="0 0.055" />
                </feComponentTransfer>
                <feBlend in="SourceGraphic" in2="grain" mode="soft-light" />
            </filter>
        </defs>
    </svg>

    
<main class="container">
  <header class="note-header">
    <h1>tech</h1>
  </header>

  <ul class="notes-list">
    
    
      <li>
        <a href="/notes/vers-des-outils-plus-libre/" class="note-item">
          <span class="note-title">Vers des outils plus libre</span>
          <span class="note-date">Mar 12 Mai 2026</span>
        </a>
      </li>
    
      <li>
        <a href="/notes/terre-fraiche/" class="note-item">
          <span class="note-title">C&#39;est en ligne</span>
          <span class="note-date">Jeu 3 Avr 2025</span>
        </a>
      </li>
    
  </ul>

  <footer class="footer">
    <a href="/" class="back-link footer-button">Retour</a>
    <div class="footer-actions">
      <a href="/feed.xml" class="footer-button rss-button" aria-label="Flux RSS">RSS</a>
      <button type="button" class="footer-button theme-toggle" aria-label="Changer de thème" title="Changer de thème">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>

    </div>
  </footer>
</main>


    <script type="module" src="/js/note-whimsy.js"></script>
    <script type="module" src="/js/transitions.js"></script>
    <script type="module" src="/js/theme-toggle.js"></script>
</body>
</html>
